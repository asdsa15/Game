<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>问道长生 v8.0 · 道途目标</title>
<style>
  :root{
    --paper:#FAF6EE; --panel:#FFFEFB; --ink:#2F2B25; --muted:#756D60; --strong:#1F1B16;
    --jade:#5E9689; --gold:#B8912F; --cinnabar:#B04A40; --purple:#7A5F99;
    --peach:#C4748C; --sky:#5E8CB0; --bamboo:#74AE88; --mystic:#9478C9;
    --bar:#E6E1D6; --line:#D5CDFA; --edge:#D9D1C1;
    --hp:#B04A40; --mp:#4A7E9E; --cul:#9A6F1E; --life:#4A7A5E;
    --stone:#9A6F1E; --merit:#4E8A76; --karma:#7A7266;
    --warn:#FBEDE9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  html{scrollbar-gutter:stable}      /* 弹窗锁滚时不因滚动条消失而横向抖一下 */
  body.modal-open{overflow:hidden}   /* 弹窗开着时别让底页跟着滚 */
  body{
    background:
      radial-gradient(circle at 12% 8%, #ffffff 0%, transparent 38%),
      radial-gradient(circle at 88% 92%, #f0e9dc 0%, transparent 42%),
      var(--paper);
    color:var(--ink);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-size:15px; line-height:1.65;
  }

  /* ============ 顶栏 ============ */
  .topbar{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:12px 26px;border-bottom:1px solid var(--edge);
    background:rgba(250,246,238,.9);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:19px;margin:0;letter-spacing:4px;color:var(--strong);font-weight:700}
  .topbar .author{font-size:11.5px;color:var(--muted);letter-spacing:1px}
  .topbar .clock{margin-left:auto;font-size:13px;color:var(--jade);letter-spacing:1.5px;white-space:nowrap;font-weight:700}
  .topbar .sysbtn-top{margin-left:16px;flex:0 0 auto}

  /* ============ 三栏布局 ============ */
  .stage{
    display:grid;
    grid-template-columns: 272px minmax(0,1fr) 312px;
    gap:18px;
    max-width:1340px;margin:0 auto;
    padding:20px 26px 40px;
    align-items:start;
  }
  @media(max-width:1100px){
    .stage{grid-template-columns: 232px minmax(0,1fr) 272px; gap:12px; padding:16px 14px 34px}
  }
  @media(max-width:880px){
    .stage{grid-template-columns:1fr; padding:14px 16px 30px}
  }

  .col{display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}

  /* ============ 面板 ============ */
  .panel{
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:7px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(80,70,50,.07);
  }
  /* 头尾两种写法都兼容：ph/pb 与 phead/pbody */
  .panel .ph,.panel .phead{
    display:flex;align-items:center;gap:8px;margin:0;
    padding:9px 16px;color:#fff;font-size:13.5px;font-weight:700;letter-spacing:1.5px;
    background:var(--jade);
  }
  .panel .ph .sub,.panel .phead .sub{margin-left:auto;font-size:11px;font-weight:400;opacity:.92;letter-spacing:0}
  .panel .pb,.panel .pbody{padding:15px 17px 17px;font-size:13px}

  .panel.warn{border-color:#E0C0B9}
  .panel.warn .ph,.panel.warn .phead{background:var(--purple)}
  .panel.mystic .ph,.panel.mystic .phead{background:var(--mystic)}
  .panel.love .ph,.panel.love .phead{background:var(--peach)}
  .panel.gold .ph,.panel.gold .phead{background:var(--gold)}
  .panel.sky .ph,.panel.sky .phead{background:var(--sky)}
  .panel.bamboo .ph,.panel.bamboo .phead{background:var(--bamboo)}
  .panel.cinnabar{border-color:#E0C0B9}
  .panel.cinnabar .ph,.panel.cinnabar .phead{background:var(--cinnabar)}

  /* ============ 通用行 ============ */
  .sl{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted #EBE5D8;font-size:13px}
  .sl:last-child{border-bottom:none}
  .sl .k{color:var(--muted);flex:0 0 auto}
  .sl .v{color:var(--ink);font-weight:700;text-align:right;word-break:break-word}
  .sl .v.good{color:var(--merit)}
  .sl .v.danger{color:var(--cinnabar)}

  .statline{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}

  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold) 10%,var(--gold) 90%,transparent);margin:11px 0;opacity:.72}

  .row{display:flex;align-items:center;gap:7px;margin:7px 0;flex-wrap:wrap;font-size:13px}
  .row .lab{color:var(--muted);flex:0 0 auto;min-width:2.8em}
  .muted{color:var(--muted);font-size:12.5px}
  .small{font-size:12.5px}
  .good{color:var(--merit);font-weight:700}
  .danger{color:var(--cinnabar);font-weight:700}
  .numbad{color:var(--cinnabar)} .numgood{color:var(--merit)}

  /* ============ 进度条 ============ */
  .barwrap{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;flex:1 1 auto;min-width:0}
  .bar{display:inline-block;height:8px;border-radius:3px;background:var(--bar);overflow:hidden;vertical-align:middle;position:relative;flex:1 1 auto;min-width:44px}
  .bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .25s}
  .barnum{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}

  .elem{display:inline-block;padding:1px 8px;border-radius:3px;color:#fff;font-size:11.5px;line-height:1.55}

  /* ============ 选项（中间栏） ============ */
  .opts{margin:0;padding:0;list-style:none}
  .opt{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;margin:7px 0;border-radius:6px;
    background:#fff;border:1px solid #E5DFCF;
    cursor:pointer;transition:background .12s,border-color .12s,transform .1s;
  }
  .opt:hover{background:#F4FAF7;border-color:var(--jade);transform:translateX(2px)}
  .opt:active{transform:scale(.99)}
  .opt .key{
    flex:0 0 auto;width:27px;height:27px;line-height:27px;text-align:center;
    color:#fff;background:var(--jade);border-radius:50%;font-size:12.5px;font-weight:700;
  }
  .opt .tag{flex:0 0 auto;font-size:11px;color:#fff;border-radius:3px;padding:1px 7px}
  .opt .txt{flex:1 1 auto;color:var(--strong);font-size:14px;line-height:1.5}
  .opt .note{flex:0 0 auto;font-size:12px;color:var(--muted)}
  .opt[disabled]{opacity:.42;cursor:not-allowed}
  .opt[disabled]:hover{background:#fff;border-color:#E5DFCF;transform:none}

  .tag.peace{background:var(--jade)} .tag.chance{background:var(--mystic)}
  .tag.risk{background:var(--cinnabar)} .tag.love{background:var(--peach)}
  .tag.warn{background:#A0681F}

  /* ============ 事件流（左栏） ============ */
  .logbox{max-height:calc(100vh - 300px);overflow:auto;font-size:13px;line-height:1.75;padding-right:2px}
  .logbox .ev{padding:6px 0;border-bottom:1px dotted #EFE9DC}
  .logbox .ev:last-child{border-bottom:none}
  .logbox .ev .t{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px;margin-bottom:2px}
  .logbox .ev .x{color:#3A342C;font-size:13px}
  .logbox .ev.good .x{color:var(--merit)}
  .logbox .ev.danger .x{color:var(--cinnabar)}

  /* ============ 功法/状态（右栏） ============ */
  .gongfa-card{
    background:linear-gradient(135deg,#FFFEFB,#F6F1E5);
    border:1px solid #E2DAC5;border-radius:6px;padding:12px 14px;
  }
  .gongfa-card .name{font-size:15.5px;color:var(--strong);letter-spacing:1px;font-weight:700}
  .gongfa-card .tier{display:inline-block;font-size:11px;color:#fff;border-radius:3px;padding:0 7px;margin-left:7px;vertical-align:1px}
  .gongfa-card .eff{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}

  .attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
  .attr-grid .a{display:flex;justify-content:space-between;border-bottom:1px dotted #EBE5D8;padding:3px 0}
  .attr-grid .a .n{color:var(--muted)}
  .attr-grid .a .v{font-weight:700;font-variant-numeric:tabular-nums}

  /* ============ 底部环形指令盘 ============ */
  .dial-wrap{
    position:fixed;left:24px;bottom:24px;z-index:40;
    width:180px;height:180px;
  }
  .dial-core{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:76px;height:76px;border-radius:50%;
    background:linear-gradient(145deg,#6FA698,#4E8579);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(50,100,92,.34),inset 0 1px 0 rgba(255,255,255,.25);
    font-size:12px;letter-spacing:1px;font-weight:700;line-height:1.25;
    user-select:none;transition:transform .14s,box-shadow .14s;
  }
  .dial-core:hover{transform:translate(-50%,-50%) scale(1.07)}
  .dial-core .ic{font-size:16px;letter-spacing:0;margin-bottom:1px}
  .dial-core.spin{animation:spin .5s ease}
  @keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

  .dial-node{
    position:absolute;left:50%;top:50%;
    width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;
    background:#FFFEFB;border:1.5px solid var(--edge);
    color:var(--ink);font-size:11.5px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
    box-shadow:0 2px 7px rgba(80,70,50,.12);
    transition:transform .16s cubic-bezier(.2,.9,.3,1.3),border-color .16s,background .16s,box-shadow .16s;
    line-height:1.2;text-align:center;
  }
  .dial-node .g{font-size:14px;line-height:1;margin-bottom:1px;opacity:.85}
  .dial-node:hover{border-color:var(--jade);background:#EFF8F5;box-shadow:0 4px 13px rgba(50,100,92,.22)}
  .dial-node:active{transform:scale(.94)}

  .dial-wrap.open .dial-node{opacity:1;pointer-events:auto}
  .dial-wrap:not(.open) .dial-node{opacity:0;pointer-events:none}

  @media(max-width:880px){
    .dial-wrap{width:152px;height:152px;left:14px;bottom:14px}
    .dial-core{width:64px;height:64px;font-size:11px}
    .dial-node{width:46px;height:46px;margin:-23px 0 0 -23px;font-size:10.5px}
  }

  /* ============ 弹窗 ============ */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(31,27,22,.46);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:var(--paper);border:1.5px solid var(--gold);border-radius:8px;
    max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px;
    box-shadow:0 10px 40px rgba(0,0,0,.24)}
  .modal h3{margin:0 0 14px;font-size:16px;letter-spacing:2px;color:var(--strong)}

  /* ============ 存档槽 ============ */
  .slotlist{display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 12px;border:1px solid #E2DAC5;border-radius:6px;background:#fff}
  .slot .si{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 160px}
  .slot .si b{font-size:13.5px;color:var(--strong)}
  .slot .si .muted{font-size:11.5px;line-height:1.4;word-break:break-word}
  .slot .sb{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}

  /* ============ 按钮 / 输入 ============ */
  .btn{font-family:inherit;font-size:13px;padding:8px 17px;border-radius:6px;border:1px solid var(--jade);
    background:var(--jade);color:#fff;cursor:pointer;transition:all .12s;letter-spacing:.5px}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--jade)}
  .btn.gold{background:var(--gold);border-color:var(--gold)}
  .btn.risk{background:var(--cinnabar);border-color:var(--cinnabar)}
  .btn.mini{padding:5px 11px;font-size:12px;border-radius:5px}

  input,select{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;
    border:1px solid #DCD4C3;border-radius:6px;padding:7px 11px;outline:none}
  input:focus,select:focus{border-color:var(--jade)}

  .selgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:640px){.selgrid{grid-template-columns:1fr}}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;
    border:1px solid #DCD4C3;background:#fff;font-size:12.5px;cursor:pointer;transition:all .12s}
  .chip:hover{border-color:var(--jade)}
  .chip.on{border-color:var(--jade);background:#EAF5F1;color:#326B60;font-weight:700}

  .hint{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.65}
  .creation-step{font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:2px}

  /* ============ 自由输入条（中间栏底部） ============ */
  .freebar{display:flex;gap:8px;margin-top:12px}
  .freebar input{flex:1 1 auto;min-width:0}
  .freebar .btn{flex:0 0 auto}

  /* ============ 创角页 ============ */
  .stage-create{max-width:840px;margin:0 auto;padding:22px 20px 130px}

  /* ============ 传法铭文 ============ */
  .liturgy{
    font-size:15px;line-height:2;color:var(--strong);
    padding:14px 18px;margin:2px 0 4px;
    background:linear-gradient(135deg,#FFFEFB,#F6F2E6);
    border-left:3px solid var(--gold);border-radius:0 6px 6px 0;
    letter-spacing:1.5px;text-align:justify;
  }
  @media(max-width:640px){.liturgy{font-size:14px;line-height:1.85;padding:12px 14px}}

  /* ============ 坊市分类标签 ============ */
  .shop-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}
  .shop-tab{
    padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12.5px;letter-spacing:1px;
    background:#fff;border:1px solid var(--edge);color:var(--muted);
    transition:border-color .14s,background .14s,color .14s;
  }
  .shop-tab:hover{border-color:var(--jade);color:#326B60}
  .shop-tab.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}

  /* ============ 斗法 · 左右双栏 ============ */
  .stage.stage-fight{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:16px; max-width:1020px;
  }
  .stage.stage-fight .col{align-self:stretch}
  .stage.stage-fight .dockrow{grid-column:1/-1}
  .stage.stage-fight .panel{height:100%}
  @media(max-width:880px){
    .stage.stage-fight{grid-template-columns:1fr}
  }

  .fighter .fname{font-size:18px;font-weight:700;letter-spacing:2px;color:var(--strong)}
  .fighter .fsub{font-size:12px;color:var(--muted);margin:3px 0 0;line-height:1.6}
  .fighter .frow{display:flex;align-items:center;gap:8px;padding:6px 0;
    border-bottom:1px dotted #EBE5D8;font-size:13px}
  .fighter .frow:last-child{border-bottom:none}
  .fighter .frow .k{color:var(--muted);flex:0 0 2.8em}
  .fighter .stance{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;
    background:#EFE9DA;color:var(--muted)}
  .fighter .stance.on{background:var(--jade);color:#fff}
  .fighter .stance.bad{background:var(--cinnabar);color:#fff}

  /* 6 项：两列三行，手机一屏放得下 */
  .fightacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* 手机上必须保持两列：一列六行会把「遁」挤出首屏，而遁是保命键。
     只在极窄（<340px）时才退成一列。 */
  @media(max-width:340px){.fightacts{grid-template-columns:1fr}}
  @media(max-width:880px){
    .fightacts .opt{padding:9px 10px;gap:7px;min-height:46px}
    .fightacts .opt .key{width:24px;height:24px;line-height:24px;font-size:12px}
    .fightacts .opt .txt{font-size:13px}
    .fightacts .opt .note{margin-left:auto;font-size:10.5px;max-width:5.2em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
  .fightacts .opt{margin:0}
  .vsline{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);
    letter-spacing:1px;margin-bottom:10px;flex-wrap:wrap}
  .vsline b{font-size:13.5px}

  /* ============ 底部常驻指令区 ============ */
  .dockrow{grid-column:1/-1;margin-top:2px}
  .dockhead{
    display:flex;align-items:baseline;gap:10px;
    padding:0 2px 9px;font-size:12.5px;color:var(--muted);letter-spacing:1.5px;
  }
  .dockhead .sub{margin-left:auto;font-size:11px;letter-spacing:0;opacity:.85}
  .dock{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(0,1fr));
    gap:10px;
  }
  .dockbtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:12px 6px 11px;border-radius:7px;cursor:pointer;
    background:var(--panel);border:1px solid var(--edge);
    box-shadow:0 1px 3px rgba(80,70,50,.07);
    transition:border-color .14s,background .14s,transform .1s,box-shadow .14s;
    min-width:0;
  }
  .dockbtn:hover{border-color:var(--jade);background:#F1FAF7;transform:translateY(-2px);box-shadow:0 5px 14px rgba(50,100,92,.16)}
  .dockbtn:active{transform:scale(.97)}
  .dockbtn .dk{
    width:29px;height:29px;line-height:29px;text-align:center;border-radius:50%;
    background:var(--jade);color:#fff;font-size:14px;font-weight:700;margin-bottom:2px;
  }
  .dockbtn .dt{font-size:12.5px;color:var(--strong);font-weight:700;letter-spacing:.5px}
  .dockbtn .ds{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* v8.1 P0 M5：指令坞折叠组 —— 常用区常驻，其余四组收起 */
  .dockgrp{margin-top:9px}
  .dockgt{
    display:flex;align-items:baseline;gap:8px;padding:8px 6px;cursor:pointer;border-radius:6px;
    background:rgba(90,80,60,.035);border:1px dashed var(--edge);
    color:var(--muted);font-size:12.5px;letter-spacing:1.5px;
    transition:border-color .14s,color .14s,background .14s;
  }
  .dockgt:hover{border-color:var(--jade);color:var(--strong);background:#F4FAF8}
  .dockgt .gn{margin-left:auto;font-size:11px;letter-spacing:0;opacity:.9}
  .dockgrp.open .dockgt{border-style:solid;border-color:var(--edge)}
  .dockgrp>.dock{margin-top:8px}

  @media(max-width:880px){
    .dock{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .dockbtn{padding:10px 4px 9px}
    .dockbtn .dk{width:26px;height:26px;line-height:26px;font-size:13px}
  }

  /* ============ 顶栏系统按钮 ============ */
  .sysbtn-top{
    margin-left:14px;padding:5px 13px;border-radius:6px;cursor:pointer;
    background:#fff;border:1px solid var(--edge);color:var(--ink);
    font-family:inherit;font-size:12.5px;letter-spacing:1px;
    transition:border-color .14s,background .14s;
  }
  .sysbtn-top:hover{border-color:var(--jade);background:#F1FAF7;color:#326B60}

  /* 系统面板按钮网格 */
  .sysgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  @media(max-width:620px){.sysgrid{grid-template-columns:1fr 1fr}}
  .sysgrid .sysbtn{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:12px 8px;border-radius:7px;cursor:pointer;
    background:#fff;border:1px solid var(--edge);font-family:inherit;
    transition:border-color .14s,background .14s;
  }
  .sysgrid .sysbtn:hover{border-color:var(--jade);background:#F1FAF7}
  .sysgrid .sysbtn b{font-size:14px;color:var(--strong);letter-spacing:1px}
  .sysgrid .sysbtn span{font-size:11px;color:var(--muted)}
  .sysgrid .sysbtn.danger{border-color:#E0C0B9}
  .sysgrid .sysbtn.danger b{color:var(--cinnabar)}
  .sysgrid .sysbtn.danger:hover{background:#FBEDE9}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:70;
    background:rgba(31,27,22,.93);color:#FAF6EE;padding:11px 22px;border-radius:6px;font-size:13px;
    letter-spacing:.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  /* 中部主面板更醒目 */

  /* ============ v6.6 功过格 ============ */

  @keyframes achIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @media(max-width:640px){#achstack{right:10px;top:64px}.achtoast{width:118px;padding:9px 11px}}

  .achhdr{font-size:12px;color:var(--ink);background:#F6F2E6;border-left:3px solid var(--gold);

  .achrow{display:grid;grid-template-columns:14px 34px 1fr auto;align-items:baseline;

  .achrow:last-child{border-bottom:none}

  .achrow.clickable:hover{background:#F1FAF7;border-radius:5px}
  .achrow .adot{width:9px;height:9px;border-radius:50%;display:inline-block;
    align-self:center;border:1px solid #C8C2B6;background:#fff}
  .achrow .adot.on{background:var(--tc);border-color:var(--tc)}
  .achrow .adot.past{background:linear-gradient(135deg,var(--tc) 0 50%,#fff 50% 100%);
    border-color:var(--tc)}

    .achrow{grid-template-columns:13px 30px minmax(0,1fr) auto;font-size:12px;gap:5px}

/* ==========================================================================
   问道长生 · 移动端补丁  v1.0
   适用：问道长生v6.html（v6.2 双栏对战版）
   注入方式：由 build.py 自动插到 style 结束标签之前；也可手动粘贴到 style 末尾。
   注意：注释里不要出现 style 的结束标签原文，否则会提前闭合样式块。
   原则：全部写在「触屏」或「窄屏」条件下，PC 端表现一个像素都不变。
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. 三类移动端"手感故障"的根因修复
   -------------------------------------------------------------------------- */
html{
  -webkit-text-size-adjust:100%;      /* iOS 横竖屏切换时不再自动放大字号 */
  overscroll-behavior-y:none;         /* 到顶下拉不回弹，避免误触"刷新"丢档 */
  touch-action:manipulation;          /* 消除 300ms 点击延迟 */
}
body{
  padding-bottom:env(safe-area-inset-bottom);   /* iPhone 底部横条留白 */
}

/* --------------------------------------------------------------------------
   2. 触屏设备：触控目标 ≥44px，关掉会"粘住"的 hover
   -------------------------------------------------------------------------- */
@media (hover:none),(pointer:coarse){
  .opt{min-height:44px;padding:12px 14px}
  .opt .key{width:30px;height:30px;line-height:30px;font-size:13px}
  .opt:hover{background:#fff;border-color:#E5DFCF;transform:none}
  .opt:active{background:#EAF5F1;border-color:var(--jade);transform:scale(.995)}

  .btn{min-height:40px;padding:9px 18px}
  .chip{min-height:38px;padding:8px 12px}

  .dockbtn:hover{transform:none;box-shadow:none}
  .dockbtn:active{transform:scale(.96)}

  .sysbtn-top{min-height:40px;padding:8px 14px}   /* 36px 仍低于 40px 的下限 */
  .sysbtn-top:hover{background:#fff;border-color:var(--edge);color:var(--ink)}
}

/* 按钮类元素不参与长按选中，避免误拖出蓝底 */
.opt,.btn,.chip,.dockbtn,.sysbtn-top{-webkit-user-select:none;user-select:none}

/* --------------------------------------------------------------------------
   3. 输入框：字号必须 ≥16px，否则 iOS 聚焦时会把整页放大
   -------------------------------------------------------------------------- */
@media(max-width:900px){
  input,select,textarea{font-size:16px}
}

/* --------------------------------------------------------------------------
   4. 视口单位：手机地址栏会伸缩，100vh 会导致跳动 → 优先 dvh
   -------------------------------------------------------------------------- */
@supports (height:100dvh){
  .logbox{max-height:calc(100dvh - 300px)}
  .modal .box{max-height:86dvh}
}

/* --------------------------------------------------------------------------
   5. 顶栏：窄屏压缩成一行，并避开刘海
   -------------------------------------------------------------------------- */
@supports (padding:max(0px)){
  .topbar{padding-top:max(12px,env(safe-area-inset-top))}
}
@media(max-width:640px){
  .topbar{padding:9px 14px;gap:8px;backdrop-filter:none}  /* 安卓 webview 上 blur 掉帧 */
  .topbar h1{font-size:16px;letter-spacing:2px}
  .topbar .author{display:none}
  .topbar .clock{margin-left:auto;font-size:11px;letter-spacing:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .sysbtn-top{margin-left:8px;padding:6px 12px;font-size:12px;flex:0 0 auto}
}

/* --------------------------------------------------------------------------
   6. 单列顺序：手机上先给「剧情＋选项」，纪事与状态往后放
   -------------------------------------------------------------------------- */
@media(max-width:880px){
  /* :not(.stage-fight) —— 否则会把对战的「敌左我右」顺序也打乱 */
  .stage:not(.stage-fight){grid-template-columns:1fr;gap:12px;padding:12px 12px 96px}
  .stage:not(.stage-fight) > .col:nth-of-type(2){order:1}   /* 叙事＋选项（最先看到） */
  /* 指令坞排第二：手机上它才是主操作区。旧顺序把它放在纪事与状态之后，
     常用指令（功法/坊市）要先滚过两栏才够得着。 */
  .stage:not(.stage-fight) > .dockrow{order:2}
  .stage:not(.stage-fight) > .col:nth-of-type(1){order:3}   /* 天时·纪事 */
  .stage:not(.stage-fight) > .col:nth-of-type(3){order:4}   /* 状态 */
  .stage:not(.stage-fight) .logbox{max-height:220px}
}

/* --------------------------------------------------------------------------
   7. 对战：手机上保持左右并排，不竖排（对峙感优先，也省高度）
   -------------------------------------------------------------------------- */
@media(max-width:880px){
  .stage.stage-fight{grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 90px}
  .stage.stage-fight .fighter .fname{font-size:15px;letter-spacing:1px}
  .stage.stage-fight .fighter .fsub{font-size:11px}
  .stage.stage-fight .fighter .frow{font-size:12px;gap:6px;padding:4px 0}
  .stage.stage-fight .fighter .frow .k{flex:0 0 2.2em}
  .stage.stage-fight .fighter .stance{font-size:10.5px;padding:1px 6px}
  .stage.stage-fight .panel .pb{padding:10px 11px 12px}
  .stage.stage-fight .panel .ph{font-size:12px;padding:7px 11px}
  .stage.stage-fight .barnum{font-size:10.5px}
  .stage.stage-fight .vsline{font-size:11.5px;gap:6px}
  /* 六键的说明不再用省略号截断：宁可多一行，也别让玩家看不到「符 2 张 · 丹」 */
  .stage.stage-fight .fightacts .opt{flex-wrap:wrap;row-gap:1px;padding:8px 10px}
  .stage.stage-fight .fightacts .opt .note{flex:1 1 100%;max-width:none;margin-left:0;
    text-align:right;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
  /* 战况：底部那块空白不如放最近四条，打完不用翻纪事 */
  .fightlog{margin-top:10px;padding-top:8px;border-top:1px dotted #E6E0D2;
    font-size:11.5px;line-height:1.7;color:var(--muted);max-height:7em;overflow:hidden}

  /* ============================================================
     v8.0 自由行动意图表（文字修仙的核心）
     ------------------------------------------------------------
     旧版「自由输入」只有 6 个正则分支，其余全部掉进
     「做了一月，没落下什么」——玩家写什么都是同一句话，
     等于告诉他「你的字没用」。
     这里把常见行为拆成 30 类意图，每类给 3~4 种结果：
       · w    权重（同一意图内的概率分布）
       · eff  实际影响（修为/材料/好感/业力…）
       · text 正文（一句到三句，写具体细节，不写总结）
       · minT 最低阶（胎息0 练气1 筑基2 紫府3 金丹4），让高境界读到不同的字
     写法上守三条：
       1) 只写看得见听得见的东西，不写「你感到很充实」这类旁白结论
       2) 每个结果都要有代价或落空，不能全是好事
       3) 境界变了，同一件事的感受就要变——这是修仙文的「质变」
     ============================================================ */
  const INTENTS = [
    /* ---------- 修行 ---------- */
    { id: 'meditate', name: '打坐', keys: ['打坐', '采气', '吐纳', '入定', '静坐', '调息', '运功', '炼气', '行功'], soft: ['坐', '息'], outs: [ { w: 3, eff: { xiuweiMul: 1.0 }, text: '气自鼻端入，凉。过三寸便分不清，是血在行，抑或山气在行。睁眼时香已过半，窗外有鸟，不知其叫了几时。' }, { w: 2, eff: { xiuweiMul: 1.1, heart: 1 }, text: '坐至第二炷香，忽闻自己心跳。一下，一下，似有人在极远处叩门。数至第七下，声散矣。' }, { w: 1, eff: { xiuweiMul: 0.6, heart: -1 }, text: '今日心浮。数息至四十即断，从头再数，复断。第三次断时索性不数，只坐着，看香灰一寸寸长。' }, { minT: 4, w: 2, eff: { xiuweiMul: 1.35 }, text: '入定后身如空坛，天地之气自灌。你不敢动，恐一动即满。坛满何如，无人说过。' } ] },
    { id: 'seclusion', name: '闭关', keys: ['闭关', '死关', '长闭关', '闭死关'], soft: ['闭'], outs: [ { w: 3, eff: { xiuweiMul: 3.2, hpPct: -0.15 }, text: '封洞口，只留一线通气。前三日最难，第七日以后便不知日子。出关那日剃须，刀钝三次。' }, { w: 2, eff: { xiuweiMul: 2.2, heart: -1, hpPct: -0.1 }, text: '闭至第二月，气走岔一回。黑暗里坐了整夜方捋顺，后背尽湿，天明才知自己一直在抖。' }, { w: 1, eff: { xiuweiMul: 0.8, heart: -2 }, text: '闭得太急，入了岔路。醒来时天已换两季，修为未动多少。石壁上尽是抓痕，深处嵌着指甲。' }, { w: 2, eff: { xiuweiMul: 2.6, insight: 1 }, text: '洞中无昼夜，只数呼吸。数至十万，忽分不清是你在呼吸，还是洞在呼吸。' } ] },
    { id: 'practice', name: '练功', keys: ['练剑', '试剑', '磨剑', '练功', '演练', '修习', '练刀', '打拳', '练拳', '演武'], soft: ['剑', '刀', '拳', '功'], outs: [ { w: 3, eff: { xiuweiMul: 0.7, sense: 1 }, text: '一招劈三百遍。前百遍尚问对否，后二百遍手自运。收势时臂酸难举，心中却静。' }, { w: 2, eff: { xiuweiMul: 0.5, insight: 1 }, text: '剑尖点石七下，七点连成一弧。你盯着看了许久，忽明师父当年为何只教这一招：他也只会这一招。' }, { w: 1, eff: { hpPct: -0.08, xiuweiMul: 0.4 }, text: '收势太急，气未归位，喉头一甜。扶树立了片刻，把血咽回去。地上那口血，用脚蹭进土里。' }, { minT: 2, w: 2, eff: { xiuweiMul: 0.9, sense: 1 }, text: '剑意出三丈即散。你知该到五丈，身却记不住那个分寸。练至天黑，散九次，第十次近了半尺。' } ] },

    /* ---------- 采集与行走 ---------- */
    { id: 'gatherHerb', name: '采药', keys: ['采药', '采草', '寻药', '挖药', '摘药', '采芝', '找草药'], soft: ['药', '草'], outs: [ { w: 3, eff: { mat: ['lanyouCao', 1] }, text: '崖下湿滑。掐一株三年生，根须完整，抖去土，以布裹好塞进囊中。指甲缝里留一道草汁的青。' }, { w: 2, eff: { mat: ['lanyouCao', 1] }, text: '背阴石缝里有一小丛，叶背发紫。年份不足。摘一半，留一半，留的那半明年还长。' }, { w: 1, eff: { hp: -8 }, text: '转半日只得几株寻常野草。归途脚下一滑，膝头磕破，坐在石上掀开裤腿，血已把布浸透。' }, { minT: 3, w: 2, eff: { mat: ['lanyouCao', 2] }, text: '已不必蹲身去找。立于崖上，哪片叶子含着灵气，一眼可见。看中哪株，那株也知自己要被人采。' } ] },
    { id: 'gatherOre', name: '采矿', keys: ['挖矿', '采矿', '寻矿', '采石', '砍柴', '挖玉', '采铁'], soft: ['矿', '石', '柴'], outs: [ { w: 3, eff: { mat: ['tieMu', 1] }, text: '矿脉露头只巴掌大。敲半个时辰，得一小块，断面有细密银星。手震得发麻，虎口裂开一道。' }, { w: 2, eff: { stones: 40 }, text: '未得正经矿，倒捡了几块品相尚可的碎石。背到镇上，收石的老者掂了掂，给了些灵石，未还价。' }, { w: 1, eff: { hp: -12, xiuweiMul: 0.3 }, text: '洞顶塌了一角。滚出来时满身是灰，肩被砸青。躺在洞口喘了半日，才想起囊中之物还在不在。' }, { w: 2, eff: { hp: -5, xiuweiMul: 0.2 }, text: '挖到底，一层青灰岩。锤下只留一个白点，换三个角度皆然。这层岩底下有何物，你不知。' } ] },
    { id: 'hunt', name: '猎妖', keys: ['猎妖', '杀妖', '除妖', '打猎', '寻妖', '狩猎', '捕兽'], soft: ['猎', '妖', '兽'], outs: [ { w: 3, eff: { stones: 120, mat: ['mudanYao', 1], fame: 3 }, text: '一只三尾山狐被堵在石缝。杀它只用两剑，剥皮却费小半个时辰。皮子完整，摊开有一人长。' }, { w: 2, eff: { hpPct: -0.25, stones: 60 }, text: '遇一头成形的黑獾，力气比预想的大。压住它时手臂被撕开一道深口。它死时仍在挣。' }, { w: 1, eff: { hpPct: -0.08, karma: 2, xiuweiMul: 0.3 }, text: '跟了三日，才觉那不是妖，是个在山中迷路的樵夫。收剑，他跪着磕头。你未扶，转身去了。' }, { minT: 3, w: 2, eff: { stones: 200, mat: ['mudanYao', 1] }, text: '不必追。伸手一引，林中鸟尽飞，它自草里出来。此等手段用久了，便觉无味。' } ] },
    { id: 'travel', name: '远行', keys: ['游历', '远行', '下山', '出门', '走走', '游山', '赶路', '云游'], soft: ['游', '走', '路'], outs: [ { w: 3, eff: { xiuweiMul: 0.4, insight: 1 }, text: '行四十里，见一条无名之河。河上有老者补网，网破三处，补了大半日。问他此河通向何处，他说不知。' }, { w: 2, eff: { stones: 30, fame: 2 }, text: '路过小集，替人看了一场病。人家硬塞一包干粮与几块碎灵石。干粮硬，硌牙，你还是吃完。' }, { w: 1, eff: { hpPct: -0.15, xiuweiMul: 0.3 }, text: '走错路，绕进一片沼地。鞋陷泥中拔不出，最后光着一只脚走了半日。脚底划破，不知被何物所划。' }, { w: 2, eff: { insight: 1 }, text: '路上遇一队赶车的，跟了两日。他们说话你听不懂，却学会他们歇脚时先喂牲口、后自己饮水。' } ] },

    /* ---------- 人 ---------- */
    { id: 'visit', name: '探望', keys: ['拜访', '探望', '去看', '寻访', '求见', '登门'], soft: ['访', '找'], outs: [ { w: 3, eff: { fav: 5 }, text: '门未关。她正筛药，头也未抬，只说一个「坐」字。你坐了一下午，一句话未说。临走她才问：伤好了么。' }, { w: 2, eff: { fav: 3, stones: -20 }, text: '提两斤酒上门。他接了酒，却先问你身上之伤从何而来。你说不小心，他笑了一下，未再问。' }, { w: 1, eff: { fav: -2 }, text: '等了半日，人未见到。门房说主人出门了，可你分明看见窗里有灯，灯下人影动了一动。' }, { w: 2, eff: { fav: 4, insight: 1 }, text: '去时他正劈柴。你接过斧子劈了半垛，手上茧磨破了。他递一碗水，说：你从前不做这个。' } ] },
    { id: 'discuss', name: '论道', keys: ['论道', '请教', '问道', '求教', '辩论', '辩法'], soft: ['论', '问'], outs: [ { w: 3, eff: { fav: 4, insight: 1 }, text: '你问筑基之后气当往何处走。他想许久，说：你先把筑基之前走完，再来问。此话听似推托，实是实话。' }, { w: 2, eff: { fav: 6, insight: 1 }, text: '说到第三炷香，两人皆不再言。有些话说到尽头便是如此，不是谁说服了谁，是说倦了。' }, { w: 1, eff: { fav: -3, heart: -1 }, text: '你话说得太满。他笑了一下，不再接话。归途上你才想起错在何处，想通也不打算回去说。' }, { w: 2, eff: { insight: 2 }, text: '他讲一个故事，讲完问你懂么。你说懂。他说：那我再讲一遍。第二遍讲完，你才知自己没懂。' } ] },

    /* ---------- 闲事 ---------- */
    { id: 'drink', name: '饮酒', keys: ['喝酒', '饮酒', '买醉', '独酌', '小酌', '喝一杯'], soft: ['酒'], outs: [ { w: 3, eff: { heart: 1, stones: -10 }, text: '酒是酸的，不算好。你还是喝完，因为杯子是旁人留下的。杯沿有一道缺口，你喝时正好绕开。' }, { w: 2, eff: { heart: 2, xiuweiMul: 0.3, stones: -20 }, text: '饮至第三杯，忽想起许久以前一件小事。想完又觉没什么可想的，再倒一杯。' }, { w: 1, eff: { heart: -1, hp: -5, stones: -30 }, text: '醉了一场。醒来躺在门口，身上少了半袋灵石，谁拿的不知。头疼得厉害，疼得你笑了出来。' }, { w: 2, eff: { heart: 1 }, text: '独饮至半夜。店家要打烊，来问要不要收。你说再坐一会儿。他便把灯留了一半，自去睡了。' } ] },
    { id: 'read', name: '读书', keys: ['读书', '看书', '翻阅', '研读', '读经', '温书'], soft: ['书', '卷'], outs: [ { w: 3, eff: { insight: 1 }, text: '纸上讲「气行如织」。你读二十遍，忽想起幼时看母亲织布的样子：线是断的，接起来才成布。' }, { w: 2, eff: { insight: 1, xiuweiMul: 0.4 }, text: '书里有一页被人撕去。你猜了许久撕去的是什么，猜不出，反把前面几页记住了。' }, { w: 1, eff: { insightXp: 6 }, text: '读到眼涩，抬头才知天黑。今日读了什么，一时竟想不起，只记得页边有一处批注，字很丑。' }, { minT: 3, w: 2, eff: { insight: 2 }, text: '书上的字你早认全了，今日这一句却忽然不同。不是字变了，是你站到了能读懂它的地方。' } ] },
    { id: 'fish', name: '垂钓', keys: ['钓鱼', '垂钓', '溪边', '下钩'], soft: ['钓', '鱼'], outs: [ { w: 3, eff: { heart: 1 }, text: '一日无鱼咬钩。你也不急，收竿，把饵给了岸边的野狗。它闻了闻，没吃，趴在脚边睡了。' }, { w: 2, eff: { heart: 1, merit: 2 }, text: '钓上一条，太小，又放了。它在水里打了个转，没走。你看了一会儿，收竿归去。' }, { w: 1, eff: { heart: 2, insight: 1 }, text: '浮子动了一下便无动静。你忽明白，它不是来吃饵，是在看你的影子。影子落在水面，比人还长。' }, { w: 2, eff: { heart: 1, hp: -3 }, text: '钓得一条半斤的，鳞是青的。你不舍得放，也不舍得杀，用竹篓养着带回。第二日它死了，你还是煮了汤。' } ] },
    { id: 'chess', name: '下棋', keys: ['下棋', '对弈', '棋'], soft: ['棋', '弈'], outs: [ { w: 3, eff: { insight: 1 }, text: '输七目。收官时他指着棋盘一处说：你早看见了，只是舍不得。' }, { w: 2, eff: { insight: 1, heart: 1 }, text: '至中盘，两人皆停。盘上那条大龙，谁也不敢先动。末了是他先伸手，把子收了。' }, { w: 1, eff: { heart: -1 }, text: '棋未下完。对局者被人叫走，棋留在石桌上，黑白子被山风吹乱两处。你未去摆正。' }, { w: 2, eff: { insight: 2, heart: -1 }, text: '让三子仍是输。他一边收子一边说：你下得太急。急不是坏事，急了便看不见旁人在等什么。' } ] },
    { id: 'scenery', name: '看景', keys: ['看雪', '观星', '赏月', '看云', '看海', '听雨', '赏花', '看日出', '听风'], soft: ['雪', '月', '星', '云', '雨', '花', '海'], outs: [ { w: 3, eff: { heart: 1 }, text: '云自西来，一层压一层。你一直站到它把整座山罩住，才想起该收衣裳。' }, { w: 2, eff: { heart: 2, insight: 1 }, text: '星子极密。数至一百七十余便不数了，总有新的在暗处亮起，数不完。' }, { w: 1, eff: { heart: 1, hp: -5 }, text: '看雪太久，脚冻僵了。回屋时鞋底粘一层冰，敲了半日才落，敲下的冰里夹着草屑。' }, { w: 2, eff: { heart: 1, insight: 1 }, text: '月自东边上来时是红的，后来才白。你不明白为何如此，也未去问。' } ] },
    { id: 'tea', name: '煮茶', keys: ['煮茶', '烹茶', '泡茶', '喝茶', '煎茶'], soft: ['茶'], outs: [ { w: 3, eff: { heart: 1 }, text: '水开三回。第二回最宜，头回太嫩，三回已老。这些是旁人教的，你记了许多年，教的人已不在了。' }, { w: 2, eff: { heart: 2, insight: 1 }, text: '茶里有一点松针气。你没放松针，是水自松林那边流过来。' }, { w: 1, eff: { stones: -5 }, text: '火太旺，壶裂了。你看着那道裂纹，把剩下的水倒进土里。水渗下去，土色深了一块。' }, { w: 2, eff: { heart: 2 }, text: '为自己倒一杯，又为对面倒一杯。对面的杯子一直无人端起，凉透了才收。' } ] },
    { id: 'scripture', name: '抄经', keys: ['抄经', '写经', '临帖', '写经卷', '抄书'], soft: ['经', '帖'], outs: [ { w: 3, eff: { heart: 1, insightXp: 4 }, text: '抄至第七卷，手不抖了。字仍不好看，但每一笔都落在该落之处。' }, { w: 2, eff: { heart: 2, merit: 3 }, text: '抄错一字。你没有撕掉重来，只在旁点了三点：错便错了，留着。' }, { w: 1, eff: { heart: -1, hp: -3 }, text: '抄到一半伏案睡去。醒来时墨干在笔上，一纸尽糊，糊得看不出写的是哪一卷。' }, { w: 2, eff: { heart: 1, insight: 1 }, text: '抄完最后一卷，把笔洗净，晾在笔架上。忽然不知道明日该做什么。' } ] },

    { id: 'inquire', name: '打听', keys: ['打听', '询问', '探听', '消息', '问路', '了解'], soft: ['打听', '消息'], outs: [ { w: 3, eff: { insight: 1 }, text: '茶棚里坐半日，听三件事，两件是假的。第三件无人提，但有人听见时把手缩了一下。' }, { w: 2, eff: { stones: -20 }, text: '花几块灵石，问到一个地名。那人收了钱，又补一句：别一个人去。' }, { w: 1, eff: { fame: -2 }, text: '问得太直，被人当成探子。你走时，背后有两道目光一直跟着，跟过一条街才散。' }, { w: 2, eff: { insight: 1 }, text: '问了一圈，都说不知。最后一个扫地的老者抬头看你一眼，说了半句，又低头去扫。' } ] },

      aucLotWon: null,    // 已拍得的客籍拍品名

      tutStep: 0,         // 新手引导进度（到 TUTORIAL_STEPS.length 即结束）

      // —— v6.7 恩义·钩子 ——

      hooksGiven: [],     // 别人欠你的（可以讨，但可能赖账）

      hookSeen: 0         // 被窥视次数
    };
  }

  /* ============ 公式 ============ */
  const st = (k) => S.stats[k] || 1;
  const xrealm = () => D.XIAN_REALMS[S.xRealm];
  const pillar = () => D.PILLARS[S.pillar];
  const posName = () => D.POSITIONS[S.pos];

  function isXian() { return S.cultivation === 'xian'; }
  function isShen() { return S.cultivation === 'shen'; }
  /* 神道线判定：纯神道或双修都应能走神道（修复 P1-9） */
  function usesShenLine() { return isShen() || S.cultivation === 'both'; }

  function realmName() {
    if (isXian() || S.cultivation === 'both') {
      const r = xrealm();
      const s = r.stages[S.xStage] || '';
      return r.name + (s ? '·' + s : '');
    }
    return pillar().name + '·' + posName();
  }

  /* 仙道月修为 */
  function monthXiuwei() {
    const r = xrealm();
    if (!r.base) return 0;
    const qi = D.LINGQI[S.lingqi].v;
    const qual = st('qualify') / 10;
    const root = S.root ? D.ROOTS[S.root].mul : 1;
    const g = getDaogong();
    const gf = g ? D.GONGFA_TIERS[g.tier].mul : 1;
    let zt = 1.0;
    if (S.hp / S.hpMax < 0.33) zt = 0.4;
    else if (S.hp / S.hpMax < 0.66) zt = 0.7;
    else if (S.hp / S.hpMax < 0.9) zt = 0.9;

    let v = r.base * qi * qual * root * gf * zt;
    // 体质加成只在这里乘一次（先天道体 +50%）
    if (S.body === 'dao') v *= 1.5;
    const _bd1 = D.BODIES.filter(function (b) { return b.id === S.body; })[0] || {};
    if (_bd1.both && S.cultivation === 'both') v *= _bd1.both;   // 玄阴 / 纯阳：双修增益
    if (S.lu && S.lu.name === '行气吞灵') v *= 1.2;
    if (S.cultivation === 'both') v *= 0.8;   // 未定：前两阶 −20%
    if (S.meditate) v *= 2;                   // 闭关 ×2
    if (S.cultBonus && S.cultBonus > 1) v *= S.cultBonus; // 日月玄浆：本月有效
    if (hasDebuff('borrowed_luck')) v *= 1.2;  // 借来的运：快，但会走火
    return v;
  }

  /* 庙产计数 */
  function miaoUpCount(k) { return (S.miaoUp && S.miaoUp[k]) || 0; }

  /* 神道月香火 */
  function monthXianghuo() {
    const f = S.followers / 4;
    const miaoC = D.MIAO_COEFF[S.miao] || 1;
    const qi = D.LINGQI[S.lingqi].v;
    const qiheC = isShen() ? 1.2 : 0.8;
    let zt = 1.0;
    if (S.hp / S.hpMax < 0.33) zt = 0.4;
    else if (S.hp / S.hpMax < 0.66) zt = 0.7;
    if (S.templeBroken) zt = Math.min(zt, 0.6);
    let v = f * S.piety * miaoC * qi * qiheC * zt;
    v *= (1 + 0.08 * miaoUpCount('lu'));          // 铜香炉：每座 +8%
    if (S.body === 'dao') v *= 1.5;
    const _bd2 = D.BODIES.filter(function (b) { return b.id === S.body; })[0] || {};
    if (_bd2.both && S.cultivation === 'both') v *= _bd2.both;
    if (S.cultivation === 'both') v *= 0.8;
    if (S.meditate) v *= 1.5;
    const cap = pillar().need / 12;
    return { raw: v, capped: Math.min(v, cap), cap };
  }

  function maxXianghuo() {
    const load = S.root ? D.ROOTS[S.root].load : 1;
    const base = pillar().need * (load >= 1.5 ? 2.5 : 2);
    /* 庙地契 +30%/张；牧土神印 +15%/级（v8.0） */
    return Math.round(base * (1 + 0.3 * miaoUpCount('di')) * dArtSealMul());
  }

  /* ============ v8.0 神道神器 ============
     三件神器都只加「已有的东西」：显圣信众、显圣耗香、香火上限与权柄斗法。
     不做新的资源，也不碰仙道；断了灵石供奉就集体失效——这是它们唯一的下限。 */
  function dArtRaw(id) { return (S.dArt && S.dArt[id]) || 0; }
  /* 停供期间等级还在，但一切加成都当 0 用；补上维护就立刻恢复。 */
  function dArtLv(id) { return (S.dArtIdle ? 0 : dArtRaw(id)); }
  function dArtUpkeep() {
    let sum = 0;
    for (const a of D.DIVINE_ARTIFACTS) sum += a.upkeep * dArtRaw(a.id);
    return sum;
  }
  /* 摄心神杖：显圣所得信众 ×(1+20%/级) */
  function dArtStaffMul() { return 1 + 0.20 * dArtLv('staff'); }
  /* 照愿法镜：显圣耗香 −8%/级（与法铃叠乘，合计最低留四成） */
  function dArtMirrorCut() { return clamp(0.08 * dArtLv('mirror'), 0, 0.6); }
  /* 牧土神印：香火上限 +15%/级；权柄斗法 +12%/级 */
  function dArtSealMul() { return 1 + 0.15 * dArtLv('seal'); }
  function dArtSealPower() { return 1 + 0.12 * dArtLv('seal'); }

  /* ============ v8.0 愿物 ============
     香火 → 灵石的第二条闸门。坊市的「化香火钱」按月只出 2~5 石，
     愿物则把香火做成香客要买的东西：能换更多灵石，但要先垫灵石成本、
     且受信众数量限制（没人来买，做出来只能压仓）。两条渠道各走各的，不互通。 */
  function votItem(id) { return D.VOTIVE_ITEMS.find(function (v) { return v.id === id; }) || null; }
  function votHave(id) { return (S.votive && S.votive[id]) || 0; }
  /* 有信众才有人来求；庙再大，没人上门也做不成生意。 */
  function votCraftCap() { return clamp(1 + Math.floor((S.followers || 0) / 800), 1, 4); }
  function votSellCap() { return clamp(1 + Math.floor((S.followers || 0) / 400), 1, 5); }
  function votStockTotal() {
    let n = 0;
    for (const v of D.VOTIVE_ITEMS) n += votHave(v.id);
    return n;
  }

  /* ============ v8.0 信众来源缩放 ============
     传教是「常数收益」，流失是「百分比」，于是信众必然在 收益/流失率 处饱和：
     30+115 人/月 ÷ 1% ≈ 11500 人——这个数与柱位无关。
     而五柱起的信众上限是 3 万 / 9.5 万 / 30 万，光靠传教永远够不到，
     结果就是越往后越只能反复刷显圣（一次几百人，要刷几百次）。
     这里让「传教」与「显圣」两条来源都随上限等比放大，
     使每柱拉信众的耗时稳定在一两年，而不是按柱位指数级增长。 */
  function followerScale() {
    return Math.max(1, followLimit() / 3450);
  }

  /* 买香只能补到本柱需求的八成——余下两成须得真信众来烧 */
  function xiangBuyCap() {
    return Math.round(pillar().need * D.EXCHANGE.buyCapRatio);
  }

  /* 每月可化香火钱的上限（灵石）：香火钱箱就那么大 */
  function xiangOutCap() {
    const x = D.EXCHANGE;
    return x.outCapBase + Math.floor(S.followers / x.outCapPer) + x.outCapBox * miaoUpCount('box');
  }

  /* 锚定强度 */
  function anchorStrength() {
    let v = 0;
    for (const k in S.anchors) v += S.anchors[k];
    return v;
  }
  function anchorStatus() {
    const v = anchorStrength();
    for (const a of D.ANCHOR_STATUS) if (v >= a.min && v < a.max) return a;
    return D.ANCHOR_STATUS[D.ANCHOR_STATUS.length - 1];
  }
  function needsAnchor() {
    return (isXian() && S.xRealm >= 5) || (isShen() && S.pillar >= 7) || S.cultivation === 'both' && S.xRealm >= 5;
  }

  /* ============ 时间 ============ */
  const MN = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];

  /* ============================================================
     v8.0 行动预算：月拆三旬
     ------------------------------------------------------------
     改之前的问题：修为由 monthXiuwei() 在 advanceMonth 里自动结算，
     「打坐」按钮本身不产出任何东西——它只是调用 advanceXun(1)。
     于是时间不是成本，是奖励：你躺着不动，修为照样涨。
     155 个动作里有 125 个不花时间，所有系统都是免费外挂，
     没有取舍，也就没有策略。

     改之后：每月三旬，每旬一次行动。
       打坐 1 旬  → 修为 + 月修为/3
       全月打坐   → 月修为（与改前完全一致，数值曲线不动）
       做一件事   → 少 1/3 月修为，这就是机会成本

     XUN_PER_MONTH 设成 1 即退回「一月一行动」的旧行为。
     这是唯一的回退开关：所有时间推进都走 advanceXun()。
     ============================================================ */
  const XUN_PER_MONTH = 3;
  const XUN_NAME = ['上旬', '中旬', '下旬'];
  /* 一月要打坐三次才顶过去，如果三次回报同一句话，
     玩家会觉得在点点点。三旬各一句，成本极低，但把「重复」变成了「推移」。 */
  const XUN_SIT = [
    '天没亮就坐了，露水顺着瓦檐滴到石阶上。',
    '日头移到院当中，影子缩到脚边不动了。',
    '夜里坐的，灯芯爆了一下，屋里暗了半瞬。'
  ];
  function season() { const m = S.month; return m >= 3 && m <= 5 ? '春' : m <= 8 ? '夏' : m <= 11 ? '秋' : '冬'; }
  function timeLine() {
    const y = Math.floor(S.turn / 12);
    const xn = XUN_NAME[S.xun || 0] || '';
    return (y === 0 ? `天玄历 ${S.year} 年 · ${MN[S.month]}月` : `入道第 ${y} 年 · ${MN[S.month]}月`) + ' ' + xn;
  }

  /* 修为入账：带小数累积器，保证「每旬给月修为/3」三次之后与「给整月修为」一致。
     直接 Math.round(v/3) 会每旬丢掉零点几，三个月能差出三四点，
     全打坐路径的时长就会与改前对不上。 */
  function gainXiuwei(v) {
    if (!(v > 0)) return 0;
    S.xiuAcc = (S.xiuAcc || 0) + v;
    const whole = Math.floor(S.xiuAcc);
    if (whole <= 0) return 0;
    S.xiuAcc -= whole;
    const need = xrealm().need;
    const before = S.xiuwei;
    S.xiuwei = need ? Math.min(need, S.xiuwei + whole) : S.xiuwei + whole;
    return S.xiuwei - before;
  }

  /* 推进 n 旬。这是全项目唯一的时间入口。
     ------------------------------------------------------------
     跨旬不结算世界，跨月才走 advanceMonth()——寿元、家族、NPC、行情、
     维护这些本来就是「按月」的事，不该被拆成三次。
     动作的时间成本一律 1 旬，写法统一为 advanceXun(1)。 */
  function advanceXun(n) {
    n = n || 1;
    for (let i = 0; i < n; i++) {
      S.xun = (S.xun || 0) + 1;
      if (S.xun >= XUN_PER_MONTH) {
        S.xun = 0;
        advanceMonth(1);
        if (S.phase !== 'play') return;
      }
    }
  }

  /* 本旬还能做几次事（界面显示用） */
  function xunLeft() { return Math.max(1, XUN_PER_MONTH - (S.xun || 0)); }

  function advanceMonth(n) {
    n = n || 1;
    for (let i = 0; i < n; i++) {
      S.turn++; S.month++;
      if (S.month > 12) { S.month = 1; S.year++; }
      // 新的一月：清空收支账本（上个月的已在左栏看过）
      ledgerReset();
      S.dishes = { dan: 0, qi: 0, fu: 0, zhen: 0 };
      S.votMade = 0; S.votSold = 0;   // 愿物按月重置制作/售出次数
      S.xiangExchangeMonth = 0;      // 香火钱箱按月清空额度

      /* —— 仙道：修为不再由时间自动产出。
         旧版这里直接 S.xiuwei += monthXiuwei()，等于「你躺着也涨」，
         于是「打坐」按钮没有任何独立价值，它只是主动跳过一个月。
         现在修为只由打坐产出（ACT.cultivate 每旬给月修为/3，闭关按月给）。
         lastGain 仍按满月速率记，界面用它显示「若全月打坐能得多少」。 */
      if (isXian() || S.cultivation === 'both') {
        S.lastGain = Math.round(monthXiuwei() * 10) / 10;
      }

      /* —— 神道：香火不再由时间自动产出（与修为同理），
         改由「坐庙温养」按旬给出。这里只留信众生灭——
         生老病死是世界的节律，本来就该按月。 */
      if (isShen() || S.cultivation === 'both') {
        if (S.followers > 0) {
          // P1-10：按设定的「净」流失率结算（生灭已折进这个数）
          let loss = S.trustee ? 0.003 : (S.meditate ? 0.02 : 0.01);
          if (S.sanxuan === 'dou') loss *= 0.8;   // 兜玄：信众增长 +20% → 流失打八折
          S.followers = Math.max(0, Math.round(S.followers * (1 - loss)));
          const lim = followLimit();
          if (lim && S.followers > lim) S.followers = lim;
        }
      }

      // —— 寿元（年龄只在跨年时 +1）
      S.lifeStop = isShen() && lifeStoppedShen();
      if (needsAnchor()) {
        S.lifeStop = true;   // 无寿元上限
        if (S.month === 1) S.age++;
      } else if (S.lifeStop) {
        if (S.month === 1) S.age++;   // 香火续命：年龄只增不减
      } else if (S.month === 1) {
        S.age++;
        if (S.age >= S.lifeMax) { die('寿元耗尽。你在蒲团上坐着，直到风把道袍吹干。'); return; }
      }

      // 人情压身：一年老一分道心
      if (S.month === 1 && hasDebuff('debt_weight')) {
        S.stats.heart = Math.max(1, S.stats.heart - 1);
        logLine('又一年。你想不清自己欠了几个人。道心 −1。', 'danger');
      }

      // —— 锚时钟（P0-5：到期未办 → 转松/转断，之后 resolveAnchors 接管）
      if (needsAnchor()) {
        tickAnchors();
        resolveAnchors();
        if (S.phase !== 'play') return;
      }
      // —— 气血自然回复（按月，按境界，按伤势打折）
      if (S.hp < S.hpMax && S.hp > 0) {
        S.hp = Math.min(S.hpMax, S.hp + monthlyHeal());
      }
      // —— 灵力回复（原只在吃丹药与创角时变化，打几场就永久枯竭）
      if (S.mp < S.mpMax) {
        S.mp = Math.min(S.mpMax, S.mp + 5 + (S.xRealm || 0) * 3);
      }
      // —— 神位人功（P0-7）
      tickShenwei();
      // —— 家族：族人供奉与族运自然增长
      tickClan();
      // —— v8.0：NPC 主动来访/病故（一次只挂一件，不打断当前面板）
      if (S.phase === 'play') tickNpcEvents();
      /* —— v8.0 仇家上门：业力与夺祀/叛门的真后果
         旧版 S.enemy 只在夺祀时置一次 true，之后再没人读过，
         等于「你多了个死仇」只是一句日志。现在它会真的找上门。 */
      if (S.phase === 'play' && !S.combat && !S.pendingVengeance) {
        if (S.enemy) {
          const chase = clamp(0.02 + S.karma / 2000, 0.02, 0.08);
          if (Math.random() < chase) S.pendingVengeance = 'person';
        }
        /* 叛门的账也要有人来收。旧版 S.enemySect 写了一次就再没人读过，
           等于「立过的誓会咬人」只是面板上的一句话。 */
        if (!S.pendingVengeance && S.enemySect && Math.random() < 0.03) {
          S.pendingVengeance = 'sect';
        }
      }
      // —— 四艺：行情波动、阵盘维持费
      tickMarket();
      if (Array.isArray(S.disks) && S.disks.length) {
        let upkeep = 0;
        S.disks.forEach(function (d) {
          const dk = D.ARRAY_DISKS.find(function (x) { return x.id === d.id; });
          upkeep += dk ? dk.upkeep : 0;
        });
        if (upkeep > 0) {
          if (S.stones >= upkeep) {
            S.stones -= upkeep;
            ledgerAdd('out', '阵盘维持', upkeep);
          } else {
            // 付不起就失效
            S.disks = [];
            logLine('灵石断了，阵盘一座座暗下去。', 'danger');
          }
        }
      }
      // —— v8.0 神器维护：灵石供奉断了，加成本月全失效（等级不降，补上即恢复）
      const artUp = dArtUpkeep();
      if (artUp > 0) {
        if (S.stones >= artUp) {
          S.stones -= artUp;
          ledgerAdd('out', '神器维护', artUp);
          if (S.dArtIdle) logLine('神器重新供上了，铃又响了。', 'good');
          S.dArtIdle = 0;
        } else {
          S.dArtIdle = (S.dArtIdle || 0) + 1;
          logLine('灵石断了供奉，神器一间间静下来。', 'danger');
        }
      } else if (S.dArtIdle) { S.dArtIdle = 0; }

      // —— 宗门月俸
      if (S.sect && S.sect.rank > 0) {
        const pay = D.SECT.ranks[S.sect.rank].pay;
        if (S.month === 1) { S.stones += pay * 12; logLine('宗门年俸到账：灵石 +' + pay * 12 + '。', ''); }
      }
      // —— 神道灵石进项（P1-12）
      if (usesShenLine()) {
        S.stoneAcc = (S.stoneAcc || 0) + shenStoneIncome();
        if (S.stoneAcc >= 1) {
          const g2 = Math.floor(S.stoneAcc);
          S.stones += g2;
          S.stoneAcc -= g2;
          ledgerAdd('in', '香火钱', g2);
        }
      }

      // —— 香火反噬
      if (isShen() && S.karma > 50 && !S.sui) {
        if (rnd100() <= S.karma / 5) {
          const halve = S.merit > 50 ? 0.5 : 1;
          if (S.body === 'chun' && !S.chunImmune) S.chunImmune = true;
          else if (rnd100() <= 50 * halve) {
            S.rebound = (S.rebound || 0) + 1;
            S.stats.heart = Math.max(1, S.stats.heart - 1);
            S.followers = Math.round(S.followers * 0.9);
            S.suiFlag = true;
            if (S.rebound >= 3) S.sui = true;
          }
        }
      }
    }
    // P1-9：截断到 maxXianghuo（need×2~2.5），余额保留为超额储备
    if (isShen() && S.xianghuo > maxXianghuo()) S.xianghuo = maxXianghuo();
    // —— v6.6 功过格钩子 1：月度统计（必须放 for 之外，否则推进 n 月会跑 n 遍）
    if (S.phase === 'play') { afterMonthTally(); tickHooks(); checkAch(); }
  }

  function lifeStoppedShen() {
    const th = [100, 300, 800, 2000, 5000, 12000, 30000, 80000][S.pillar] || 100;
    return S.followers >= th && S.xianghuo > 0;
  }

  /* ============ 锚结算（v6.2 核心） ============ */
  function resolveAnchors() {
    const v = anchorStrength();
    const status = anchorStatus();

    if (v >= 3.0) {
      // 恢复稳定必须把崩解计数归零，否则一旦崩解过，
      // 状态栏永远挂着「崩解期第 N 月」，do_med 也会永久提前中断。
      if (S.collapse > 0) { S.collapse = 0; logLine('四锚复固，崩解止住了。', 'good'); }
      S.anchorState = '稳'; return;
    }

    if (v >= 2.0) {
      S.anchorState = '虚';
      if (rnd100() <= 20) {
        // 恍惚：忘一件事
        S.forgetCount = (S.forgetCount || 0) + 1;
        logLine('恍惚——你忽然想不起一个本该记得的事。', 'danger');
      }
      return;
    }

    if (v >= 1.0) {
      S.anchorState = '将散';
      if (rnd100() <= 60) logLine('异象：影子短了一截，信徒说神像换了张脸。', 'danger');
      return;
    }

    // 失锚 → 崩解期
    S.anchorState = '失锚';
    S.collapse = (S.collapse || 0) + 1;
    if (S.collapse === 1) logLine('崩解第 1 月：金性生锈／塑像裂／仪式忘了词。', 'danger');
    else if (S.collapse === 2) logLine('崩解第 2 月：你说话带上了回声。', 'danger');
    else if (S.collapse >= 3) {
      // 补回至少两根锚才能挽回
      let solid = 0;
      for (const k in S.anchors) if (S.anchors[k] >= 1) solid++;
      if (solid < 2) {
        die(isXian() ? '道化：你的意识散成一片山雾。你还在，只是不再是你。'
                     : '枯朽：那尊像还在，只是不再应你。');
        return;
      }
      S.collapse = 0;
      logLine('你在最后一月补回了锚，稳住了自己。', 'good');
    }
  }

  function logLine(txt, cls) {
    S.log.unshift({ t: timeLine(), txt, cls: cls || '' });
    if (S.log.length > 200) S.log.pop();
    // 年谱：左栏事件流只留 200 条给现场看，年谱留全部，可导出成文件
    if (!Array.isArray(S.chronicle)) S.chronicle = [];
    S.chronicle.push({
      turn: S.turn, year: S.year, month: S.month, age: S.age,
      realm: realmName(), cls: cls || '', txt: txt
    });
    if (S.chronicle.length > 4000) S.chronicle.shift();
  }
  function toast(m) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = m; el.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(() => el.classList.remove('show'), 1800);
  }
  function die(reason) {
    /* v8.0：临终一择。还有一口气时先给玩家三条路——最后一搏、传功后人、托付道统。
       一局只给一次（S.dyingUsed），用过之后再死就是真死，免得变成反复读命的免死金牌。 */
    if (S.phase === 'over' || S.phase === 'dying') return;
    if (!S.dyingUsed) {
      S.dyingUsed = true;
      S.dying = { reason: reason };
      S.phase = 'dying';
      S.combat = null;
      try { checkAch(); } catch (e) { }
      return;
    }
    finalizeDeath(reason);
  }

  function finalizeDeath(reason) {
    // —— v6.6 过格记账：所有死亡都从这里出去 ——
    try {
      const t = tly();
      t.deaths = (t.deaths || 0) + 1;
      if (S.combat && S.combat.foe) {
        const myR = realmIdxRank(positionRank()), foeR = realmIdxRank(S.combat.foe.rank);
        if (myR === foeR) bump('deathBySame');
        if (combatTierNow(S.combat) === '绝境') bump('deathCrush');
      }
      if (/寿元/.test(String(reason))) bump('deathSit');
      if (/道化|锚|枯朽/.test(String(reason))) bump('deathDaohua');
      let near = 0; const g2 = S.npcs || {};
      for (const k in g2) if ((g2[k] || {}).fav >= 40) near++;
      if (!near) bump('deathLonely');
      if ((S.chronicle || []).length < 10) bump('deathEmpty');
    } catch (e) { }
    S.phase = 'over'; S.deathReason = reason; S.combat = null;
    try { checkAch(); } catch (e) { }
  }

  /* ============ 渲染工具 ============ */
  function bar(cur, max, color) {
    const w = 4.5, a = clamp(cur / (max || 1), 0, 1) * w;
    return `<span class="barwrap"><span class="bar" style="width:${w}em">
      <i class="fill" style="width:${a}em;background:${color}"></i></span>
      <span class="barnum">${fmtNum(cur)}/${fmtNum(max)}</span></span>`;
  }
  function elemChip(k) {
    const e = D.ELEMENTS[k] || D.MUT_ELEMENTS[k];
    return e ? `<span class="elem" style="background:${e.color}">${e.name}</span>` : '';
  }
  function panel(title, body, o) {
    o = o || {};
    return `<div class="panel ${o.cls || ''}"><div class="ph">${esc(title)}${o.sub ? `<span class="sub">${o.sub}</span>` : ''}</div><div class="pb">${body}</div></div>`;
  }
  const divider = () => '<div class="divider"></div>';
  function optRow(k, txt, tag, note, dis, act) {
    const t = tag ? `<span class="tag ${tag.cls}">${esc(tag.name)}</span>` : '';
    return `<li class="opt"${dis ? ' disabled' : ''} data-act="${esc(act)}">
      <span class="key">${esc(k)}</span>${t}<span class="txt">${esc(txt)}</span>
      ${note ? `<span class="note">${esc(note)}</span>` : ''}</li>`;
  }
  /* 两行货架行：名与价同一行，说明另起一行。
     庙市的说明比坊市长（香火/石/已置数），用 optRow 会在 390 宽把名称挤成竖排。 */
  function shopRow(name, meta, desc, dis, act) {
    return `<li class="opt"${dis ? ' disabled' : ''} data-act="${esc(act)}">
      <span class="key">·</span><span class="txt">${esc(name)}<span class="muted">　${esc(meta)}</span>
      ${desc ? `<br><span class="muted" style="font-size:12px;line-height:1.45">${esc(desc)}</span>` : ''}</span></li>`;
  }
  function favorTier(f) { for (const t of D.FAVOR_TIERS) if (f >= t.min && f <= t.max) return t.name; return '陌生'; }

  function getGongfa() { return D.GONGFA.find(g => g.id === S.gongfa[0]) || D.GONGFA[0]; }
  /* 道基功法：与 getGongfa 同源，另立名字是为了让「功法分家」这件事在代码里看得见 */
  function getDaogong() {
    return D.GONGFA.find(function (g) { return g.id === S.daogong; }) || getGongfa();
  }
  /* 唯一的「获得功法」入口。之前坊市/传法/奇遇三处各写一次裸 push，
     旧档缺字段时必崩；收成一个函数，兜底只需要写一遍。 */
  function addGongfa(id) {
    if (!D.GONGFA.find(function (g) { return g.id === id; })) return false;
    if (!Array.isArray(S.ownedGongfa)) S.ownedGongfa = ['juqi'];
    if (S.ownedGongfa.indexOf(id) >= 0) return false;
    S.ownedGongfa.push(id);
    const g = D.GONGFA.find(function (x) { return x.id === id; });
    queueGain('功法《' + (g ? g.name : id) + '》', 0,
      (g && g.tier ? (D.GONGFA_TIERS[g.tier] || {}).name + ' · ' : '') + '要参悟才换主修', true);
    return true;
  }
  function followLimit() {
    // 在两柱之间按对数平滑增长，不再从镇上限突然跳到城上限。
    const t = clamp((S.pillar + S.pos / 3) / 2, 0, D.FOLLOW_LIMIT.length - 1);
    const lo = Math.floor(t), hi = Math.min(D.FOLLOW_LIMIT.length - 1, lo + 1);
    if (lo === hi) return D.FOLLOW_LIMIT[lo].max;
    const a = D.FOLLOW_LIMIT[lo].max, b = D.FOLLOW_LIMIT[hi].max;
    return Math.round(a * Math.pow(b / a, t - lo));
  }

  /* ============ 战力 ============ */
  function computePower() {
    if (isShen()) {
      const p = pillar();
      const posMul = [1.0, 1.15, 1.3, 1.45][S.pos];
      let stMul = 1.0;
      if (S.hp / S.hpMax < 0.33) stMul = 0.4;
      else if (S.hp / S.hpMax < 0.66) stMul = 0.7;
      if (S.templeBroken) stMul *= 0.8;
      let sd = 0.8 + S.shenTong.length * 0.05;
      sd = clamp(sd, 0.8, 2.0);
      /* 牧土神印：权柄斗法 +12%/级 */
      const base = p.power * posMul * stMul * sd * dArtSealPower();
      // 锚定影响
      const as = anchorStatus();
      let am = 1;
      if (as.name === '虚') am = 0.85;
      if (as.name === '将散') am = 0.6;
      if (as.name === '失锚') am = 0.3;
      return Math.round(base * am * (bodyDef().pow || 1));
    }
    // 仙道
    const r = xrealm();
    let base = r.power;
    if (r.idx === 0 && S.xStage < 5) base = 5;
    if (r.idx === 1) base = 25 + S.xStage * 2;
    if (r.idx === 2) {
      base = { '黄基': 80, '玄基': 90, '地基': 105, '天基': 125 }[S.xianji] || 80;
    }
    if (r.idx === 3) base = 350 * Math.pow(1.15, S.shenTong.length);
    if (r.idx === 4) base = S.guowei ? D.GUOWEI_RANK[S.guowei.rank].power : 450;
    if (r.idx >= 5) base = 6000;
    let stMul = 1.0;
    if (S.hp / S.hpMax < 0.33) stMul = 0.4;
    else if (S.hp / S.hpMax < 0.66) stMul = 0.7;
    else if (S.mp <= 0) stMul = 0.6;
    let sd = 0.8 + S.shenTong.length * 0.05;
    sd = clamp(sd, 0.8, 2.0);
    const as = anchorStatus();
    let am = 1;
    if (as.name === '虚') am = 0.85;
    if (as.name === '将散') am = 0.6;
    if (as.name === '失锚') am = 0.3;
    return Math.round(base * stMul * sd * am * (bodyDef().pow || 1));
  }

  /* 位格：仙道用境界档，神道用柱位 */
  /* ============================================================
     位阶换算（v6.7 修复「机缘一遇就死档」的根因）
     ------------------------------------------------------------
     旧写法 `xRealm * 4 + xStage` 假设每境四阶，但实际阶数是
       胎息 6 / 练气 9 / 筑基 4 / 紫府 3 / 金丹 1 / 道胎 1。
     于是 练气九层（xRealm 1, stage 8）算出 rank 12 —— 与紫府一关同号；
     startCombat 里 `floor(foeR/4)` 再一查表，敌人直接被抬成紫府
     （战力 350 vs 玩家 25），R≈0.07，两回合必死。
     机缘是随机触发的，所以这不是"难度"，是死档。
     ------------------------------------------------------------
     现在：rank 由各境真实阶数累加得出；反向有 realmIdxRank / stageIdxRank。
     跨体系（仙↔神）不靠 rank 比大小，改用 realmGap() 只比"大境差"，
     具体强弱一律交给战力比 R。 */
  function rankBaseXian() {
    const out = [0];
    const rs = D.XIAN_REALMS || [];
    for (let i = 0; i < rs.length; i++) {
      out.push(out[i] + Math.max(1, (rs[i].stages || []).length || 1));
    }
    return out;
  }
  function positionRank() {
    if (isShen()) return S.pillar * 4 + S.pos;
    const b = rankBaseXian();
    const i = clamp(S.xRealm, 0, (D.XIAN_REALMS || []).length - 1);
    return b[i] + clamp(S.xStage, 0, 99);
  }
  /* rank → 境界索引（神道即柱序） */
  function realmIdxRank(rank) {
    rank = Math.max(0, Math.round(Number(rank) || 0));
    if (isShen()) return clamp(Math.floor(rank / 4), 0, 7);
    const b = rankBaseXian();
    let idx = 0;
    for (let i = 0; i < (D.XIAN_REALMS || []).length; i++) if (rank >= b[i]) idx = i;
    return idx;
  }
  /* rank → 该境内的第几阶 */
  function stageIdxRank(rank) {
    rank = Math.max(0, Math.round(Number(rank) || 0));
    if (isShen()) return clamp(rank % 4, 0, 3);
    const i = realmIdxRank(rank);
    const b = rankBaseXian();
    const n = ((D.XIAN_REALMS[i] || {}).stages || []).length || 1;
    return clamp(rank - b[i], 0, n - 1);
  }
  /* 我当前的境界索引（仙=境界序号，神=柱序） */
  function myRealmIdx() { return isShen() ? S.pillar : S.xRealm; }
  /* 大境差：>0 敌人更高。这是唯一用于文案与减伤的尺度 */
  function realmGap(foeRank) { return realmIdxRank(foeRank) - myRealmIdx(); }

  /* ============ 渲染（三栏：左事件 / 中选择 / 右状态） ============ */
  function render() {
    const stage = document.getElementById('stage');
    const clockEl = document.getElementById('clock');

    /* 兜底：气血归零却还停在 'play' —— 目前只有 foeTurn 会把血打到 0 并立刻处理，
       但这类「状态机漏一条出口」正是本作反复栽的坑（foeTurn 不 render、
       dispatch 不认 enc:、pendingEnc 残留）。宁可在这里多拦一次。 */
    if (S && S.phase === 'play' && S.started && S.hp <= 0) {
      die('气血耗尽。你没撑到下一个春天。');
    }
    // 道途目标：任何会触发重绘的变化都在这里结算（破境、升柱、信众达标…）
    if (S && S.phase === 'play' && S.started) checkGoals();
    const c = clockEl;
    if (c) c.textContent = S.started ? timeLine() : '天玄历 387 年 · 春';
    if (!stage) return;

    if (S.phase === 'create') {
      stage.className = 'stage-create';
      stage.innerHTML = renderCreate();
      renderDial(true);
      return;
    }
    stage.className = 'stage';
    if (S.phase === 'over') { stage.innerHTML = renderOver(); renderDial(true); scheduleAutoSave(); return; }
    if (S.phase === 'dying') { stage.innerHTML = renderDying(); renderDial(true); scheduleAutoSave(); return; }
    if (S.phase === 'combat') {
      if (!S.combat) { S.phase = 'play'; }        // 脏状态直接降级，走下面的正常渲染
      else {
        stage.className = 'stage stage-fight';     // 左右双栏
        stage.innerHTML = renderCombat();
        scheduleAutoSave();
        return;
      }
    }

    stage.innerHTML =
      '<div class="col">' + renderEventCol() + '</div>' +
      '<div class="col">' + renderMainCol() + '</div>' +
      '<div class="col">' + renderStateCol() + '</div>' +
      '<div class="dockrow">' + renderDock() + '</div>';
    renderDial(true);
    scheduleAutoSave();
  }

  /* 防抖自动存档：避免每帧写 localStorage */
  function scheduleAutoSave() {
    if (typeof autoSave !== 'function') return;
    clearTimeout(scheduleAutoSave._h);
    scheduleAutoSave._h = setTimeout(function () { autoSave(); }, 600);
  }

  /* ---------- 左栏：天时 + 事件流 ---------- */
  function renderEventCol() {
    let logHtml = '<div class="muted">尚无纪事。</div>';
    if (S.log.length) {
      logHtml = '<div class="logbox">' + S.log.slice(0, 24).map(function (l) {
        return '<div class="ev ' + (l.cls || '') + '"><span class="t">' + esc(l.t) +
          '</span><span class="x">' + l.txt + '</span></div>';
      }).join('') + '</div>';
    }

    let b = '';
    b += '<div class="sl"><span class="k">所在</span><span class="v">' + esc(curPlace()) + '</span></div>';
    b += '<div class="sl"><span class="k">时节</span><span class="v">' + season() + ' · ' + MN[S.month] + '月</span></div>';
    b += '<div class="sl"><span class="k">道途</span><span class="v">' +
      esc((D.PATHS.filter(function (p) { return p.id === S.path; })[0] || {}).name || '—') + '</span></div>';

    return panel('天时 · 纪事', b + divider() + renderLedger() +
      '<div class="small" style="margin-bottom:6px;color:var(--muted)">近期事件</div>' + logHtml,
      { sub: '左' });
  }

  /* ---------- 右栏：状态 + 修为 + 六维 ---------- */
  function renderStateCol() {
    let b = '';
    b += '<div class="sl"><span class="k">道号</span><span class="v">' + esc(S.dao || S.name) + '</span></div>';
    b += '<div class="sl"><span class="k">年岁</span><span class="v">' + S.age + ' 岁</span></div>';
    b += '<div class="sl"><span class="k">境界</span><span class="v">' + esc(realmName()) + '</span></div>';
    b += '<div class="sl"><span class="k">战力</span><span class="v">' + computePower() + '</span></div>';
    b += '<div class="sl"><span class="k">主修</span><span class="v">' +
      esc((D.CULTIVATION.filter(function (c) { return c.id === S.cultivation; })[0] || {}).name || '—') + '</span></div>';

    if (S.lifeMax) {
      const lr = S.age / S.lifeMax;
      b += '<div class="row" style="margin-top:6px"><span class="lab">寿元</span>' +
        bar(S.lifeStop ? 0 : Math.max(0, S.lifeMax - S.age), S.lifeMax, lr > 0.75 ? 'var(--cinnabar)' : 'var(--life)') + '</div>';
    } else {
      b += '<div class="row" style="margin-top:6px"><span class="lab">寿元</span><span class="good small">无上限（靠锚）</span></div>';
    }

    const showDao = (isShen() && S.unlockStage >= 2) || (isXian() && S.unlockStage >= 3);
    if (showDao && S.daotong) {
      // 道统先归入大类（金行/木行/十二炁…），再给具体名目
      const dtClass = daotongClassOf(S.daotong);
      b += '<div class="sl"><span class="k">道统</span><span class="v">' + esc(S.daotong) +
        (dtClass ? '<span class="small muted">（' + esc(dtClass) + '）</span>' : '') +
        (S.sanxuan ? ' · ' + esc(D.SANXUAN[S.sanxuan].name) : '') + '</span></div>';
      // 该道统下可得的杀伐神通（把 SHENTONG 表也接上，不再只作装饰）
      const pool = D.SHENTONG[S.daotong];
      if (pool && pool.length) {
        b += '<div class="small muted" style="margin-top:-2px">可求神通：' +
          pool.slice(0, 4).map(esc).join('、') + (pool.length > 4 ? ' 等 ' + pool.length + ' 道' : '') + '</div>';
      }
    }
    if (S.xianji) b += '<div class="sl"><span class="k">仙基</span><span class="v">' + esc(S.xianji) + '</span></div>';
    if (S.unlockStage >= 3) b += '<div class="sl"><span class="k">神通</span><span class="v">' + S.shenTong.length + '/' + shenTongLimit() + '</span></div>';
    if (S.lu) b += '<div class="sl"><span class="k">箓</span><span class="v">' + esc(S.lu.rank) + '箓·' + esc(S.lu.name) + '</span></div>';
    if (S.daoyin.length || (isXian() && S.xRealm >= 2)) {
      b += '<div class="sl"><span class="k">道途印</span><span class="v">' +
        S.daoyin.map(function () { return '●'; }).join('') +
        '○'.repeat(Math.max(0, 4 - S.daoyin.length)) + '</span></div>';
    }
    if (S.guowei) b += '<div class="sl"><span class="k">果位</span><span class="v">' + esc(S.guowei.n) + '（' + esc(S.guowei.rank) + '）</span></div>';

    b += divider();

    if (isXian() || S.cultivation === 'both') {
      const nr = xrealm().need;
      b += '<div class="row"><span class="lab">修为</span>' + bar(S.xiuwei, nr || 1, 'var(--cul)') + '</div>';
      b += '<div class="row" style="margin-top:-2px"><span class="lab"></span><span class="muted">月增 ' + (S.lastGain || 0) +
        '　灵气 ' + esc(D.LINGQI[S.lingqi].name) + '×' + D.LINGQI[S.lingqi].v + '</span></div>';
      b += '<div class="row"><span class="lab">气血</span>' + bar(S.hp, S.hpMax, 'var(--hp)') + '</div>';
      b += '<div class="row"><span class="lab">灵力</span>' + bar(S.mp, S.mpMax, 'var(--mp)') + '</div>';
    }
    if (isShen() || S.cultivation === 'both') {
      b += divider();
      b += '<div class="sl"><span class="k">神庙</span><span class="v">' + esc(S.miaoHao || '野庙') + ' · ' + esc(S.miao) + '</span></div>';
      b += '<div class="sl"><span class="k">信众</span><span class="v">' + S.followers + '/' + followLimit() + ' · 虔诚 ' + S.piety.toFixed(1) + '</span></div>';
      b += '<div class="row"><span class="lab">香火</span>' + bar(S.xianghuo, pillar().need, 'var(--cul)') + '</div>';
      b += '<div class="row" style="margin-top:-2px"><span class="lab"></span><span class="muted">月增 ' +
        Math.round(monthXianghuo().capped) + '　香火钱 ' + (Math.round(shenStoneIncome() * 10) / 10) +
        ' 石/月　月兑 ' + xiangOutCap() + ' 石</span></div>';
    }

    if (needsAnchor()) {
      b += divider();
      const str = anchorStrength(), as = anchorStatus();
      b += '<div class="sl"><span class="k">锚定</span><span class="v ' + (as.name === '稳' ? 'good' : 'danger') + '">' +
        str.toFixed(1) + '/4.0 · ' + esc(as.name) + '</span></div>';
      b += '<div class="small muted" style="margin-top:3px">' +
        D.ANCHOR_TYPES.map(function (a) {
          const v = S.anchors[a.id];
          const t = v >= 1 ? '<span class="good">固</span>' : v >= 0.5 ? '<span class="muted">松</span>' : '<span class="danger">断</span>';
          return esc(a.name.slice(0, 1)) + t;
        }).join(' ') + '</div>';
      if (S.collapse > 0) b += '<div class="small danger" style="margin-top:4px">崩解期第 ' + S.collapse + ' 月</div>';
    }

    const _topA = (typeof topAch === 'function') ? topAch() : null;
    if (_topA) b += '<div class="sl"><span class="k">称号</span><span class="v" style="color:' +
      (D.ACH_TIERS.filter(function(t){return t.id===_topA.tier;})[0]||{color:'#8C8578'}).color + '">' +
      esc(_topA.name) + '</span></div>';
    b += divider();
    const s = S.stats;
    b += '<div class="attr-grid">' + Object.keys(D.STATS).map(function (k) {
      return '<div class="a"><span class="n">' + esc(D.STATS[k].name) + '</span><span class="v">' + s[k] + '</span></div>';
    }).join('') + '</div>';

    if (S.root) {
      b += '<div class="row" style="margin-top:7px"><span class="lab">灵根</span>' +
        (S.rootEls || []).map(elemChip).join('') + '</div>';
      b += '<div class="small muted" style="margin-top:-2px">' + esc(D.ROOTS[S.root].name) +
        (S.body ? ' · ' + esc(D.BODIES.filter(function (x) { return x.id === S.body; })[0].name) : '') + '</div>';
    }

    b += divider();
    b += '<div class="small">灵石 <b style="color:var(--stone)">' + S.stones + '</b>　声望 ' + S.fame +
      '　功德 <b style="color:var(--merit)">' + S.merit + '</b>　业力 <b style="color:var(--karma)">' + S.karma + '</b></div>';

    // —— 恩义：欠/放的人情，以及只写征兆不写公式的因果 ——
    const _owe = hookUnsettled().length;
    const _given = (S.hooksGiven || []).filter(function (x) { return !x.done; }).length;
    if (_owe || _given) {
      b += '<div class="small" style="margin-top:4px">人情　欠 <b>' + _owe + '</b> ｜ 人欠 <b>' + _given + '</b></div>';
    }
    const _signs = hookSigns();
    if (_signs.length) {
      b += '<div class="small muted" style="margin-top:2px">' + _signs.join('　') + '</div>';
    }

    const ab = [];
    if (S.hp / S.hpMax < 0.33) ab.push('垂死');
    else if (S.hp / S.hpMax < 0.66) ab.push('重伤');
    if (S.suiFlag) ab.push('祟气缠身');
    if (S.templeBroken) ab.push('庙宇破损');
    if (S.karma > 50) ab.push('业力缠身');
    if (ab.length) b += '<div class="small danger" style="margin-top:5px">异常：' + ab.join(' · ') + '</div>';

    const met = Object.keys(S.npcs).filter(function (id) { return S.npcs[id].met; });
    if (met.length) {
      b += divider();
      b += '<div class="small muted" style="margin-bottom:3px">好感</div>';
      b += met.map(function (id) {
        const n = D.NPC_POOL.filter(function (x) { return x.id === id; })[0];
        const f = S.npcs[id].fav;
        return '<div class="sl"><span class="k">' + esc(n.name) + '</span><span class="v" style="color:var(--peach)">' +
          f + ' · ' + favorTier(f) + '</span></div>';
      }).join('');
    }

    return panel('状态 · 修为', b, { sub: '右' });
  }

  /* ---------- 中栏：场景 + 选项 + 功法卡 ---------- */
  /* O3：境界条。之前境界挤在标题右上角，11px、常规字重、92% 透明度，
     比正文还小还淡。提到中栏第一视觉层级。 */
  function realmProgress() {
    if (isShen()) return { name: realmName(), label: '香火', cur: S.xianghuo, max: pillar().need };
    const r = xrealm();
    return { name: realmName(), label: '修为', cur: S.xiuwei, max: r.need || 0 };
  }
  function renderRealmBar() {
    const p = realmProgress();
    const prog = p.max > 0 ? Math.min(1, p.cur / p.max) : 1;
    const cap = isShen() ? null : daogongCapInfo();
    let b = '<div class="realmbar">';
    b += '<div class="rb-top"><span class="rname">' + esc(p.name) + '</span>';
    b += '<span class="rsub">' + p.label + ' ' + fmtNum(Math.round(p.cur)) +
      (p.max > 0 ? ' / ' + fmtNum(p.max) : '') + '</span></div>';
    b += '<div class="rbar"><i style="width:' + (prog * 100).toFixed(1) + '%"></i></div>';
    if (cap && cap.blocked) {
      b += '<div class="rnote danger">功法所限 · 修至' + esc(cap.to) +
        ' 即止，需换更高阶道基功法（现为' + esc(cap.tierName) + '）</div>';
    } else if (cap && cap.atCap) {
      b += '<div class="rnote">已至此功法所能到的尽头（' + esc(cap.to) + '）</div>';
    }
    b += '</div>';
    return b;
  }

  /* 道基功法能给到的境界上限 */
  function daogongCapInfo() {
    const g = getDaogong();
    const c = D.DAOGONG_CAP[g.tier] || D.DAOGONG_CAP.huang;
    const rr = xrealm();
    const lastStage = clamp((rr.stages || []).length - 1, 0, 99);
    // 已在本境最后一阶，且本境就是这篇功法能到的尽头 → 卡住
    const atLast = S.xRealm >= c.cap && S.xStage >= lastStage;
    const blocked = atLast && !!rr.need;
    return {
      cap: c.cap, to: c.to, why: c.why, tierName: D.GONGFA_TIERS[g.tier].name,
      blocked: blocked, atCap: S.xRealm >= c.cap
    };
  }

  /* 手机端首屏快照：气血 / 灵力 / 灵石 / 寿元（神道换信众）。
     桌面三栏齐全，手机竖屏的状态栏在页面最底部——不把这四个数抬上来，
     玩家每次都得滚两屏才知道自己还剩多少血、多少钱。 */
  function renderVitals() {
    const lowHp = S.hp / S.hpMax < 0.33;
    const lowLife = S.lifeMax && !S.lifeStop && (S.lifeMax - S.age) <= 20;
    let b = '<div class="vitals">';
    b += '<div class="vt"><span>气血</span><span class="vn' + (lowHp ? ' low' : '') + '">' +
      Math.round(S.hp) + '<span class="muted">/' + Math.round(S.hpMax) + '</span></span></div>';
    b += '<div class="vt"><span>灵力</span><span class="vn">' +
      Math.round(S.mp) + '<span class="muted">/' + Math.round(S.mpMax) + '</span></span></div>';
    b += '<div class="vt"><span>灵石</span><span class="vn gold">' + fmtNum(S.stones) + '</span></div>';
    if (usesShenLine()) {
      b += '<div class="vt"><span>信众</span><span class="vn">' + fmtNum(S.followers) + '</span></div>';
    } else {
      b += '<div class="vt"><span>寿元</span><span class="vn' + (lowLife ? ' low' : '') + '">' +
        (S.lifeStop || !S.lifeMax ? '无上限' : (S.lifeMax - S.age) + ' 年') + '</span></div>';
    }
    b += '</div>';
    return b;
  }

  /* ============================================================
     道途目标（v7.4）
     ------------------------------------------------------------
     不写主线剧情，只回答一个玩家最常问的问题：现在该干什么。
     沿境界/柱数排，完成一张换下一张；奖励自动入账，不弹挡住操作的窗。
     ============================================================ */
  let goalBusy = false;
  function goalsForLine() {
    return (isShen() ? D.GOALS.shen : D.GOALS.xian) || [];
  }
  function goalDone(id) { return (S.goals || []).indexOf(id) >= 0; }
  function currentGoal() {
    const list = goalsForLine();
    for (let i = 0; i < list.length; i++) if (!goalDone(list[i].id)) return list[i];
    return null;
  }
  function goalMet(g) {
    if (g.kind === 'realm') return (S.xRealm || 0) >= g.n;
    if (g.kind === 'pillar') return (S.pillar || 0) >= g.n;
    if (g.kind === 'followers') return (S.followers || 0) >= g.n;
    return false;
  }
  function goalProgText(g) {
    if (goalMet(g)) return '已至';
    if (g.kind === 'realm') {
      const cur = D.XIAN_REALMS[clamp(S.xRealm || 0, 0, D.XIAN_REALMS.length - 1)] || D.XIAN_REALMS[0];
      return '现 ' + cur.name + ' ' + ((S.xStage || 0) + 1) + '/' + ((cur.stages || []).length || 1);
    }
    if (g.kind === 'pillar') {
      return goalMet(g) ? '已至' : '香火 ' + fmtNum(Math.round(S.xianghuo)) + ' / ' + fmtNum(pillar().need);
    }
    if (g.kind === 'followers') return (S.followers || 0) + ' / ' + g.n;
    return '';
  }
  function goalRewardText(g) {
    const r = g.reward || {}, p = [];
    if (r.stones) p.push('灵石 +' + fmtNum(r.stones));
    if (r.xianghuo) p.push('香火 +' + fmtNum(r.xianghuo));
    if (r.pill) {
      const it = D.PILL_EXT.find(function (x) { return x.id === r.pill; });
      if (it) p.push(it.name + ' ×1');
    }
    return p.join(' · ') || '无';
  }
  function grantGoal(g) {
    const r = g.reward || {};
    if (r.stones) { S.stones += r.stones; ledgerAdd('in', '道途 · ' + g.name, r.stones); }
    if (r.xianghuo) S.xianghuo = Math.min(maxXianghuo(), S.xianghuo + r.xianghuo);
    if (r.pill) { S.bag = S.bag || {}; S.bag[r.pill] = (S.bag[r.pill] || 0) + 1; }
    logLine('道途 · 「' + g.name + '」已了：' + goalRewardText(g) + '。', 'good');
    goalToast(g);
  }
  function goalToast(g) {
    try {
      let box = document.getElementById('achstack');
      if (!box) { box = document.createElement('div'); box.id = 'achstack'; document.body.appendChild(box); }
      const el = document.createElement('div');
      el.className = 'achtoast';
      el.style.borderLeftColor = 'var(--gold)';
      el.innerHTML = '<div class="at">道途 · 目标已了</div>' +
        '<div class="an" style="color:var(--gold)">' + esc(g.name) + '</div>' +
        '<div class="ad">' + esc(goalRewardText(g)) + '</div>';
      box.appendChild(el);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
    } catch (e) { }
  }
  function checkGoals() {
    if (!S || !S.started || S.phase === 'over' || goalBusy) return;
    goalBusy = true;
    try {
      if (!Array.isArray(S.goals)) S.goals = [];
      for (let i = 0; i < 12; i++) {
        const g = currentGoal();
        if (!g || !goalMet(g)) break;
        S.goals.push(g.id);
        grantGoal(g);
      }
    } finally { goalBusy = false; }
  }
  function renderGoalCard() {
    const g = currentGoal();
    if (!g) return '<div class="goalcard done"><span class="gk">道途</span>' +
      '<span class="gn">已至尽头</span><span class="gp">剩下的路自己走</span></div>';
    return '<div class="goalcard" data-act="act:openGoals">' +
      '<span class="gk">道途</span><span class="gn">' + esc(g.name) + '</span>' +
      '<span class="gp">' + esc(goalProgText(g)) + '</span><span class="ga">›</span></div>';
  }
  function openGoals() {
    const list = goalsForLine();
    const cur = currentGoal();
    let b = '';
    if (S.mainline) b += '<div class="small" style="color:var(--strong)">此身之志：' + esc(S.mainline) + '</div>' + divider();
    b += '<div class="small muted">沿境界走，一步一步来。完成即换下一张，奖励自动入账。</div>' + divider();
    b += '<ul class="opts">';
    list.forEach(function (g) {
      const done = goalDone(g.id), now = !!cur && cur.id === g.id;
      const tag = done ? '<span class="tag peace">已了</span>'
        : now ? '<span class="tag chance">当前</span>'
          : '<span class="tag risk">未至</span>';
      const meta = goalRewardText(g) + (now ? '　·　' + goalProgText(g) : '');
      // 两行：名与说明一行，奖励与进度一行。用 optRow 的右对齐 note 会在窄屏把字挤成竖排。
      b += '<li class="opt"' + (now ? '' : ' disabled') + '>' +
        '<span class="key">' + (done ? '✓' : now ? '●' : '·') + '</span>' + tag +
        '<span class="txt">' + esc(g.name) + '<span class="muted">　' + esc(g.hint) + '</span>' +
        '<br><span class="muted" style="font-size:11.5px">' + esc(meta) + '</span></span></li>';
    });
    b += '</ul>';
    b += '<div class="hint">目标只是路标，不是枷锁。不做也不扣什么。</div>';
    openModal('道途 · 目标', b);
  }

  function breakReady() {
    const xianReady = hasXianLine() && (S.xRealm >= 4 || (!!xrealm().need && S.xiuwei >= xrealm().need));
    const shenReady = hasShenLine() && (S.pillar >= D.PILLARS.length - 1 || S.xianghuo >= pillar().need);
    return isBoth() ? (xianReady || shenReady) : (isShen() ? shenReady : xianReady);
  }

  /* 本月旬数条：已过的旬划掉，当前旬高亮，右侧写余几旬。
     预算必须一直看得见，否则玩家不会为它做取舍。 */
  function renderXunBar() {
    const used = S.xun || 0;
    let b = '<div class="xunbar">';
    for (let i = 0; i < XUN_PER_MONTH; i++) {
      const cls = i < used ? ' used' : (i === used ? ' now' : '');
      b += '<span class="xun' + cls + '">' + XUN_NAME[i] + '</span>';
    }
    const left = Math.max(0, XUN_PER_MONTH - used);
    b += '<span class="xunleft">本月余 ' + left + ' 旬</span></div>';
    return b;
  }

  function renderMainCol() {
    let b = '';
    b += renderRealmBar();
    b += renderVitals();
    b += renderGoalCard();
    b += '<div class="scene">' + esc(scene()) + '</div>';
    b += renderXunBar();

    const o = [];
    /* 打坐会自动坐满本月剩下的旬，所以这里报的是「坐完能得多少」。
       做一件事之后再来看，这个数就会变小——那就是刚才那件事的价格。 */
    const xunLeftNow = Math.max(1, XUN_PER_MONTH - (S.xun || 0));
    const perXun = (isXian() || S.cultivation === 'both')
      ? monthXiuwei() / XUN_PER_MONTH
      : monthXianghuo().capped / XUN_PER_MONTH;
    const gain = Math.round(perXun * xunLeftNow);
    const unit = isShen() ? '香火' : '修为';

    /* 修为已满时打坐是白扔一旬——这一旬本可以拿去做事。
       把它写在按钮上，免得玩家在满修时还习惯性点 A。 */
    const xFullNow = (isXian() || S.cultivation === 'both')
      && !!xrealm().need && S.xiuwei >= xrealm().need;
    const sFullNow = isShen() && S.xianghuo >= maxXianghuo();
    const fullNow = xFullNow || sFullNow;
    o.push(optRow('A', (isShen() ? '坐庙温养' : '打坐采气'),
      { name: '平和', cls: 'peace' },
      fullNow ? '已满 · 白坐' : ('+' + gain + ' ' + unit + '（余 ' + xunLeftNow + ' 旬）'),
      false, 'act:cultivate'));

    const full = breakReady();
    // 神道未受箓：破柱之后本该受箓，漏领则永远进不了洞天
    const noLu = hasShenLine() && !S.lu && S.pillar >= 1;
    if (noLu && full) {
      o.push(optRow('B', '受箓（入洞天之凭）', { name: '机缘', cls: 'chance' }, '未受箓则进不得洞天', false, 'act:openLuPick'));
    } else if (full) {

      o.push(optRow('D', '传教聚信', { name: '平和', cls: 'peace' }, '耗灵石', false, 'act:preach'));
    } else {

      o.push(optRow('D', '参悟功法', { name: '平和', cls: 'peace' }, '换主修', false, 'act:openGongfa'));

    const g = getDaogong();

    b += '<div class="slotline"><span class="sk">道基</span>' +

  /* ---------- 底部常驻指令区（三栏下方，等宽对齐） ---------- */
  function npcCountText() {
    const n = Object.keys(S.npcs).filter(function (id) { return S.npcs[id].met; }).length;
    return n ? n + ' 人相识' : '尚无';
  }
  function bagCountText() {
    let n = 0;
    for (const k in S.bag) n += S.bag[k] || 0;
    return n ? n + ' 件' : '空';
  }
  /* ============ v8.0 新手引导 ============
     TUTORIAL_STEPS 之前只有文案，没有任何地方展示。这里做成一条可跳过的短引导：
     不弹模态（避免顶掉开局的传法/奇遇），只在常驻区挂一个「引」按钮，走完自动消失。 */
  function tutLeft() {
    const n = D.TUTORIAL_STEPS.length;
    const i = S.tutStep || 0;
    return Math.max(0, n - i);
  }
  function openTut() {
    const steps = D.TUTORIAL_STEPS;
    const i = Math.min(S.tutStep || 0, steps.length - 1);
    const cur = steps[i];
    let b = `<div class="small muted">第 ${i + 1} / ${steps.length} 条</div>`;
    b += `<div class="small" style="margin:6px 0"><b>${esc(cur.name)}</b></div>`;
    b += `<div class="small">${esc(cur.text)}</div>`;
    b += divider() + '<ul class="opts">';
    if (i < steps.length - 1) {
      b += optRow('A', '下一条', { name: '续', cls: 'peace' }, '', false, 'do;tut:next');
    } else {
      b += optRow('A', '知道了，开始吧', { name: '完', cls: 'peace' }, '', false, 'do;tut:done');
    }
    b += optRow('B', '不必再看', { name: '略', cls: 'warn' }, '', false, 'do;tut:done');
    b += '</ul>';
    openModal('新手引导', b);
  }
  function do_tut(a) {
    if (a === 'next') S.tutStep = (S.tutStep || 0) + 1;
    else S.tutStep = D.TUTORIAL_STEPS.length;
    closeModal(); render();
  }

  function dockItems() {

      list.push({
        k: '客', t: '有人来访',

      });
    }
    list.push({ k: '功', t: '功法', s: getGongfa().name, act: 'act:openGongfa' });
    /* 新手引导走完就自己消失，不长期占位 */
    if (S.started && tutLeft() > 0) {
      list.push({ k: '引', t: '新手引导', s: '还有 ' + tutLeft() + ' 条', act: 'act:openTut' });

    // 两套系统两个市：仙道坊市只认灵石，神道庙市另开一摊
    if (isShen()) {

    } else {
      list.push({ k: '市', t: '坊市', s: '灵石 ' + fmtNum(S.stones), act: 'act:openShop' });
      if (isBoth()) list.push({ k: '庙', t: '庙市', s: '香火 ' + fmtNum(Math.round(S.xianghuo)), act: 'act:openMiaoMarket' });
    }
    /* 拍卖会只在开场的年份出现在常驻区——平时不占位置，开了就一眼看得见 */
    if (auctionOpen() && !aucUsed()) {

    /* 神器与愿物是神道专属的两条经济线：一条养战力，一条把香火换成灵石。
       只在神道/双修时出现，仙道不显示，免得占常驻区。 */
    if (usesShenLine()) {

          : '未请',
        act: 'act:openDivineArts'
      });
      list.push({
